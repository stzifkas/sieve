name: Bug report
description: Something parsed wrong, compressed wrong, or broke an integration.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected vs. what Sieve produced.
    validations:
      required: true
  - type: textarea
    id: raw-output
    attributes:
      label: Raw tool output
      description: >
        The uncompressed command output that triggered the problem (trim
        secrets). For hook/MCP issues, the relevant config snippet instead.
      render: text
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "pytest tests/ -x"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "agent-sieve 0.1.0, Python 3.12, Ubuntu 24.04, Claude Code hook"
    validations:
      required: true
